name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.10']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install cx-Freeze

    - name: Build with cx-Freeze
      run: python setup.py build

    - name: Package build (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        cd build
        BUILD_DIR=$(ls -d exe.* | head -1)
        cd "$BUILD_DIR"
        7z a ../../ModbusRTUSniffer-Windows.zip *

    - name: Package build (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cd build
        BUILD_DIR=$(ls -d exe.* | head -1)
        cd "$BUILD_DIR"
        tar -czf ../../ModbusRTUSniffer-Linux.tar.gz *

    - name: Upload artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ModbusRTUSniffer-Windows
        path: ModbusRTUSniffer-Windows.zip

    - name: Upload artifact (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ModbusRTUSniffer-Linux
        path: ModbusRTUSniffer-Linux.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: ModbusRTUSniffer-Windows

    - name: Download Linux artifact
      uses: actions/download-artifact@v4
      with:
        name: ModbusRTUSniffer-Linux

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ModbusRTUSniffer-Windows.zip
          ModbusRTUSniffer-Linux.tar.gz
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
